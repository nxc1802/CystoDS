[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cystods"
version = "0.1.0"
description = "CystoDS: Hierarchical Long-Tailed Classification for Cystoscopy Images"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.0,<3",
    "torchvision>=0.15,<1",
    "timm>=0.9,<2",
    "numpy>=1.22,<3",
    "pandas>=2.0,<4",
    "scikit-learn>=1.2,<2",
    "scipy>=1.10,<2",
    "Pillow>=9.0,<13",
    "matplotlib>=3.6,<4",
    "seaborn>=0.12,<1",
    "tqdm>=4.60,<5",
    "psutil>=5.9,<8",
    "tabulate>=0.9,<1",
    "packaging>=23,<27",
    "huggingface-hub>=0.28,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "ruff>=0.4",
    "jupytext>=1.15,<2",
]

[project.scripts]
cystods = "cystods.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99
